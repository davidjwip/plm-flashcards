name: PR gates

# Every pull request into UAT or main gets the same gate the laptop runs, and main additionally
# refuses anything that did not come through UAT. Mirrors the maths app (kgadd-uat) so both
# repos share one release discipline.
on:
  pull_request:
    branches: [UAT, main]

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Tests and the coverage thresholds in one command: `npm test` alone ignores them.
      - name: Tests + coverage
        run: npm run coverage

      - name: Word bank validator
        run: npm run validate:bank

      - name: Guardrail scan
        run: npm run guardrail:scan

      - name: Spec audit
        run: npm run spec:audit

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

  flow:
    # Only main has a source rule, so only PRs targeting main pay for this job.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The rule is a shell script so src/branchFlow.test.ts can prove each refusal rather than it
      # being asserted only by reading YAML. It is taken from the BASE branch whenever the base
      # carries it: a pull_request workflow is taken from the PR's merge ref, so running the head's
      # copy would let a PR aimed at main rewrite the rule that judges it. The first release to main
      # has no copy on main yet, so it falls back to the PR's copy and says so in the log.
      - name: Fetch the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          git fetch --depth=1 origin "$BASE"
          echo "base $BASE fetched at $(git rev-parse --short FETCH_HEAD)"

      # Fallback to the PR's own copy is reachable ONLY through "the fetch succeeded and the base
      # does not carry the script yet" — a failed fetch fails the job rather than falling through,
      # or a transient network error would hand the gate to the PR it is judging.
      - name: Use the base branch's copy of the rule
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          if git cat-file -e "FETCH_HEAD:scripts/check-branch-flow.sh"; then
            git show "FETCH_HEAD:scripts/check-branch-flow.sh" > "$RUNNER_TEMP/check-branch-flow.sh"
            echo "flow rule source: $BASE@$(git rev-parse --short FETCH_HEAD) sha256=$(sha256sum "$RUNNER_TEMP/check-branch-flow.sh" | cut -d' ' -f1)"
          else
            cp scripts/check-branch-flow.sh "$RUNNER_TEMP/check-branch-flow.sh"
            echo "::warning::$BASE does not carry scripts/check-branch-flow.sh yet (first release); running the PR's copy — read the diff"
          fi

      - name: main only accepts UAT, from this repository
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: bash "$RUNNER_TEMP/check-branch-flow.sh"
