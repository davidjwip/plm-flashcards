name: PR gates

# Every pull request into UAT or main gets the same gate the laptop runs, and main additionally
# refuses anything that did not come through UAT. Mirrors the maths app (kgadd-uat) so both
# repos share one release discipline.
on:
  pull_request:
    branches: [UAT, main]

permissions:
  contents: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Tests and the coverage thresholds in one command: `npm test` alone ignores them.
      - name: Tests + coverage
        run: npm run coverage

      - name: Word bank validator
        run: npm run validate:bank

      - name: Guardrail scan
        run: npm run guardrail:scan

      - name: Spec audit
        run: npm run spec:audit

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

  flow:
    # Only main has a source rule, so only PRs targeting main pay for this job.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The decision lives in a shell script so src/branchFlow.test.ts can prove each
      # refusal, instead of it being asserted only by reading YAML.
      - name: main only accepts UAT, from this repository
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: bash scripts/check-branch-flow.sh
