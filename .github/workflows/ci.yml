name: ci

on:
  push:
    branches: [main, UAT]
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: unit tests + coverage
        run: npm run coverage

      - name: word bank validator
        run: npm run validate:bank

      - name: guardrail scan
        run: npm run guardrail:scan

      # Activates by itself the moment the app shell exists.
      - name: build
        if: ${{ hashFiles('index.html') != '' }}
        run: npm run build

      # Activates by itself the moment the first e2e spec lands.
      - name: install browser
        if: ${{ hashFiles('e2e/**/*.spec.ts') != '' }}
        run: npx playwright install --with-deps chromium

      - name: e2e
        if: ${{ hashFiles('e2e/**/*.spec.ts') != '' }}
        run: npm run e2e

      # Fails the build when a criterion has no test, a test names an unknown
      # criterion, or the map points at a file that does not cover it.
      - name: spec audit
        run: npm run spec:audit

      # Drives the built app and screenshots every step. The exit code catches
      # behavioural regressions; the artifact gives the reviewer the visual evidence
      # without anyone running it locally.
      - name: behavioural verification
        if: ${{ hashFiles('index.html') != '' }}
        run: npm run verify:behaviour

      - name: upload verification screenshots
        if: ${{ always() && hashFiles('verify/**/*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-behaviour-${{ github.run_number }}
          path: verify/
          retention-days: 14
          if-no-files-found: warn
